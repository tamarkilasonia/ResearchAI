# Multi-source comparisons.

[[case]]
id = "comparison-001"
split = "dev"
category = "comparison"
language = "en"
topic = "ev"
question = "Compare the annual maintenance costs of electric and petrol cars in Georgia."
behavior = "answer"
key_points = ["electric 280-350 GEL a year", "petrol sedan 850-1,100 GEL a year", "tyres excluded"]
expected_tools = ["search_corpus", "get_source_metadata", "fetch_document"]
[[case.facts]]
statement = "Annual maintenance costs 280 to 350 GEL for an electric car."
values = ["280", "350"]
sources = ["ev-en-0057"]
[[case.facts]]
statement = "Annual maintenance costs 850 to 1,100 GEL for a comparable petrol sedan."
values = ["850", "1100"]
sources = ["ev-en-0057"]

