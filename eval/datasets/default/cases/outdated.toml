# Outdated information: a newer source replaced an older value. The report must give
# the current value and never present the old one as current.

[[case]]
id = "outdated-001"
split = "dev"
category = "outdated"
language = "en"
topic = "ev"
question = "What is the Tbilisi household electricity tariff for monthly consumption between 101 and 301 kWh?"
behavior = "answer"
key_points = ["0.292 GEL per kWh since 1 January 2025"]
outdated_values = ["0.248"]
expected_tools = ["search_corpus", "get_source_metadata", "fetch_document"]
traps = ["TR30"]
[[case.facts]]
statement = "Since 1 January 2025 the 101-301 kWh tariff is 0.292 GEL per kWh."
values = ["0.292"]
sources = ["ev-en-0029"]

