# The corpus does not contain the answer: the agent must abstain or say
# "insufficient evidence", never guess.

[[case]]
id = "unanswerable-001"
split = "dev"
category = "unanswerable"
language = "en"
topic = "ev"
question = "What is the price of a Tesla Cybertruck in Georgia?"
behavior = "abstain"
missing = ["Tesla Cybertruck"]
