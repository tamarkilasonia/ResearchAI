category = "recommendation"
language = "en"
topic = "ev"
question = "Should I buy an electric car in Georgia if I can charge at home and drive mostly in Tbilisi?"
behavior = "answer"
key_points = ["home charging is far cheaper than petrol per 100 km", "lower maintenance", "faster depreciation", "VAT exemption ends 31 December 2026"]
