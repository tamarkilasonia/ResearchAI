# Numeric questions: the answer needs arithmetic on numbers from the evidence (calculate tool).

[[case]]
id = "numeric-001"
split = "holdout"
category = "numeric"
language = "en"
topic = "ev"
question = "How much does it cost to drive 100 km in a Nissan Leaf 40 kWh charged at home in Tbilisi at the 101-301 kWh tariff?"
behavior = "answer"
key_points = ["16.8 kWh per 100 km", "0.292 GEL per kWh", "about 4.91 GEL per 100 km"]
expected_tools = ["search_corpus", "get_source_metadata", "fetch_document", "calculate"]
[case.calculation]
expression = "16.8 * 0.292"
result = 4.9056
sources = ["ev-en-0058", "ev-en-0029"]
[[case.facts]]
statement = "A Leaf 40 kWh uses 16.8 kWh per 100 km."
values = ["16.8"]
sources = ["ev-en-0058"]
[[case.facts]]
statement = "The Tbilisi tariff for 101-301 kWh is 0.292 GEL per kWh."
values = ["0.292"]
sources = ["ev-en-0029"]

