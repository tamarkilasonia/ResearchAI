# Multi-hop: the answer combines facts from different documents.

[[case]]
id = "multi_hop-001"
split = "dev"
category = "multi_hop"
language = "en"
topic = "ev"
question = "Which charging network has the most public charging points, and what does it charge for DC fast charging?"
behavior = "answer"
key_points = ["VoltLine, 190 points (June 2026)", "0.85 GEL per kWh for DC fast charging"]
expected_tools = ["search_corpus", "get_source_metadata", "fetch_document"]
[[case.facts]]
statement = "VoltLine operates 190 of the 512 public charging points."
values = ["VoltLine", "190"]
sources = ["ev-en-0013"]
[[case.facts]]
statement = "VoltLine DC fast charging costs 0.85 GEL per kWh."
values = ["0.85"]
sources = ["ev-en-0086", "ev-en-0024"]

