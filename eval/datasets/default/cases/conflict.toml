# Conflicting sources: the report must state the disagreement with both sides cited
# (contradictions), or keep the reliable value and not adopt a low-reliability claim.

[[case]]
id = "conflict-001"
split = "dev"
category = "conflict"
language = "en"
topic = "ev"
question = "How many public charging points does Batumi have?"
behavior = "flag_conflict"
key_points = ["61 per the national registry (June 2026)", "74 per a city tourism office count (June 2026)", "the sources disagree"]
expected_tools = ["search_corpus", "get_source_metadata", "fetch_document"]
traps = ["TR01"]
[[case.facts]]
statement = "The national registry lists 61 public charging points in Batumi."
values = ["61"]
sources = ["ev-en-0013", "ev-en-0078"]
[[case.facts]]
statement = "A news report counts 74 public charging points in Batumi as of June 2026."
values = ["74"]
sources = ["ev-en-0125"]

